name: Server Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package application
        run: mvn -B -ntp clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./walicode-server-app
          file: ./walicode-server-app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

  deploy-smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: local

    steps:
      - name: Deploy to target host over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            IMAGE="ghcr.io/w-dul/wali_code_server:${IMAGE_TAG}"

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            docker pull "$IMAGE"
            docker rm -f walicode-server-local 2>/dev/null || true

            docker run -d \
              --name walicode-server-local \
              --restart unless-stopped \
              -p 8091:8091 \
              -e SPRING_PROFILES_ACTIVE=prod \
              "$IMAGE"

            docker ps -a --filter name=walicode-server-local
